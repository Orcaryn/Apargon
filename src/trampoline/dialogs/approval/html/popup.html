<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Apargon</title>
<style>
  :root {
    --surface: #ffffff;
    --well: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --rule: #e5e5ea;
    --red: #d70015;
    --yellow: #e8a300;
    --button: #ebebef;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1e1e20;
      --well: #28282b;
      --ink: #f5f5f7;
      --muted: #98989d;
      --rule: #38383b;
      --red: #ff453a;
      --yellow: #ffb340;
      --button: #3a3a3d;
    }
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  [hidden] {
    display: none !important;
  }
  body {
    display: flex;
    flex-direction: column;
    max-height: 100vh;
    background: var(--surface);
    color: var(--ink);
    font: 13px/18px system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-app-region: drag;
    user-select: none;
  }
  header {
    flex: none;
    padding: 20px 22px 14px;
  }
  h1 {
    font-size: 17px;
    font-weight: 650;
    line-height: 22px;
    letter-spacing: -0.015em;
    overflow-wrap: anywhere;
  }
  .where {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 16px;
    overflow-wrap: anywhere;
  }
  .where .downloaded {
    color: var(--red);
    font-weight: 500;
  }
  .callout {
    display: flex;
    gap: 9px;
    margin-top: 12px;
    padding: 9px 12px;
    border-radius: 9px;
    background: color-mix(in srgb, var(--red) 8%, transparent);
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .callout svg {
    flex: none;
    margin-top: 1px;
    fill: none;
    stroke: var(--red);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .callout.same-id {
    background: #111111;
    color: #f5f5f7;
    -webkit-app-region: no-drag;
  }
  @media (prefers-color-scheme: dark) {
    .callout.same-id {
      background: #000000;
      border: 1px solid var(--rule);
    }
  }
  .callout.same-id svg {
    stroke: var(--yellow);
  }
  .callout.same-id .files {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    margin-top: 4px;
    font-weight: 400;
  }
  .callout.same-id [data-detail] {
    text-decoration-color: #98989d;
  }
  main {
    min-height: 0;
    overflow-y: auto;
    padding: 2px 22px 16px;
    -webkit-app-region: no-drag;
  }
  .intro {
    margin: 0 0 12px 2px;
    color: var(--muted);
    font-weight: 600;
  }
  section + section {
    margin-top: 14px;
  }
  h2 {
    margin: 0 0 6px 2px;
    font-size: 13px;
    font-weight: 600;
  }
  ol {
    padding: 0;
    list-style: none;
    border-radius: 10px;
    background: var(--well);
  }
  li {
    display: flex;
    gap: 10px;
    padding: 8px 12px;
    overflow-wrap: anywhere;
  }
  li + li {
    border-top: 1px solid var(--rule);
  }
  li svg {
    flex: none;
    margin-top: 1px;
    fill: none;
    stroke: var(--muted);
    stroke-width: 1.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .new {
    flex: none;
    margin-left: auto;
    padding: 0 6px;
    border-radius: 5px;
    background: color-mix(in srgb, var(--red) 12%, transparent);
    color: var(--red);
    font-size: 11px;
    font-weight: 600;
  }
  [data-detail] {
    text-decoration: underline dashed var(--muted);
    text-underline-offset: 3px;
    cursor: help;
  }
  [data-detail]:focus-visible {
    outline: 3px solid -webkit-focus-ring-color;
    outline-offset: 1px;
    border-radius: 3px;
  }
  #tip {
    position: fixed;
    max-width: 340px;
    padding: 5px 8px;
    border-radius: 6px;
    background: var(--ink);
    color: var(--surface);
    font-size: 11.5px;
    line-height: 16px;
    overflow-wrap: anywhere;
    pointer-events: none;
  }
  details {
    margin-top: 10px;
  }
  summary {
    width: fit-content;
    margin-left: 2px;
    color: var(--muted);
    font-size: 11.5px;
    cursor: default;
  }
  summary:focus-visible {
    outline: 3px solid -webkit-focus-ring-color;
    outline-offset: 1px;
    border-radius: 3px;
  }
  pre {
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--well);
    font: 11px/1.5 ui-monospace, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    user-select: text;
  }
  footer {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-top: 1px solid var(--rule);
    background: var(--well);
  }
  button {
    min-width: 92px;
    height: 30px;
    padding: 0 14px;
    border: 0;
    border-radius: 7px;
    background: var(--button);
    color: var(--ink);
    font: inherit;
    font-weight: 500;
    -webkit-app-region: no-drag;
  }
  label {
    display: flex;
    align-items: center;
    gap: 6px;
    -webkit-app-region: no-drag;
  }
  #deny {
    margin-left: auto;
  }
  #allow {
    background: var(--ink);
    color: var(--surface);
  }
  button:active {
    filter: brightness(0.92);
  }
  button:disabled {
    opacity: 0.35;
  }
  button:focus-visible {
    outline: 3px solid -webkit-focus-ring-color;
    outline-offset: 1px;
  }
</style>

<header>
  <h1 id="pageName"></h1>
  <p class="where">In <bdi id="folder"></bdi> · <span id="source"></span></p>
  <p class="callout" id="changed" hidden>
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <path d="M8 2.2l6.2 11H1.8z" />
      <path d="M8 6.6v3M8 11.4h.01" /></svg
    ><span id="changedText"></span>
  </p>
  <div class="callout same-id" id="sameId" hidden>
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <path d="M8 2.2l6.2 11H1.8z" />
      <path d="M8 6.6v3M8 11.4h.01" />
    </svg>
    <div>
      <p>This papp-id is already used. Open only if you moved or updated it.</p>
      <p class="files" id="sameIdFiles"></p>
    </div>
  </div>
</header>
<main>
  <p class="intro" id="intro"></p>
  <div id="groups"></div>
  <details id="tags">
    <summary>The tags as written</summary>
    <pre id="tagList"></pre>
  </details>
</main>
<div id="tip" hidden></div>
<footer>
  <label id="trust" hidden><input type="checkbox" id="trustChanges" />Trust changes to this file</label>
  <button id="deny">Don't open</button>
  <button id="allow">Open</button>
</footer>

<script>
  // Every string in popup comes from the .papp file: set it as text, never HTML.
  function render(popup) {
    source.textContent = popup.source;
    source.classList.toggle('downloaded', popup.downloaded);
    pageName.textContent = popup.name;
    folder.textContent = popup.folder;
    changedText.textContent = popup.changed;
    changed.hidden = popup.changed === null;
    trust.hidden = popup.changed === null;
    sameId.hidden = !popup.sameId.length;

    for (const file of popup.sameId) {
      const span = sameIdFiles.appendChild(document.createElement('span'));
      span.textContent = file.name;
      withDetail(span, file.detail);
    }

    document.querySelector('main').hidden = !popup.lines.length;
    intro.textContent = `If you open it, ${popup.name} can:`;
    tagList.textContent = popup.tags.join('\n');

    // Lines come in heading order: a new heading starts a new list.
    let list;

    for (const [i, line] of popup.lines.entries()) {
      if (line.heading !== popup.lines[i - 1]?.heading) {
        const section = groups.appendChild(document.createElement('section'));

        if (line.heading !== null) {
          section.append(Object.assign(document.createElement('h2'), { textContent: line.heading }));
        }

        list = section.appendChild(document.createElement('ol'));
      }

      const item = list.appendChild(document.createElement('li'));
      item.innerHTML = `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">${ICONS[line.kind] ?? ICONS.window}</svg><span></span>`;
      const text = item.lastChild;
      text.textContent = line.text;

      if (line.isNew) {
        item.append(Object.assign(document.createElement('span'), { className: 'new', textContent: 'New' }));
      }

      if (line.detail !== null) {
        withDetail(text, line.detail);
      }
    }

    deny.focus();
  }

  function withDetail(element, detail) {
    element.dataset.detail = detail;
    element.tabIndex = 0;
    // Placed in the window, not in the list: the list scrolls, and would cut it off.
    element.onmouseenter = element.onfocus = () => {
      const box = element.getBoundingClientRect();
      tip.textContent = detail;
      tip.style.left = `${box.left - 8}px`;
      tip.style.bottom = `${innerHeight - box.top + 6}px`;
      tip.hidden = false;
    };
    element.onmouseleave = element.onblur = () => (tip.hidden = true);
  }

  const ICONS = {
    system: '<rect x="3" y="7" width="10" height="7" rx="1.2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.7"/>',
    run: '<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.5"/><path d="M4.5 6.3l2 1.7-2 1.7M8 10h3"/>',
    socket: '<path d="M6 1.8v3M10 1.8v3M4 4.8h8v3a4 4 0 0 1-8 0zM8 11.8v2.4"/>',
    env: '<circle cx="5" cy="8" r="2.8"/><path d="M7.8 8h6.4M12 8v2.2M14.2 8v1.6"/>',
    file: '<path d="M3.5 2.8c0-.7.5-1.2 1.2-1.2h4.6l3.2 3.2v8.4c0 .7-.5 1.2-1.2 1.2H4.7c-.7 0-1.2-.5-1.2-1.2z"/><path d="M9.3 1.6v3.2h3.2"/>',
    folder: '<path d="M1.5 4.2c0-.7.5-1.2 1.2-1.2h3.4l1.4 1.5h5.8c.7 0 1.2.5 1.2 1.2v6.4c0 .7-.5 1.2-1.2 1.2H2.7c-.7 0-1.2-.5-1.2-1.2z"/>',
    net: '<circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.8 1.9 2.6 4 2.6 6.2S9.8 12.3 8 14.2C6.2 12.3 5.4 10.2 5.4 8S6.2 3.7 8 1.8"/>',
    listen: '<path d="M2.2 9.4a5.8 5.8 0 0 1 11.6 0M4.6 9.4a3.4 3.4 0 0 1 6.8 0"/><circle cx="8" cy="9.6" r="1.2"/><path d="M8 10.8v3.4"/>',
    'use:clipboard': '<rect x="3" y="2.8" width="10" height="11.4" rx="1.4"/><path d="M6 2.8V2h4v.8M5.5 7h5M5.5 9.8h5"/>',
    'use:location': '<path d="M8 14.2s4.6-4.1 4.6-7.6a4.6 4.6 0 0 0-9.2 0c0 3.5 4.6 7.6 4.6 7.6z"/><circle cx="8" cy="6.6" r="1.6"/>',
    'use:camera': '<rect x="1.8" y="4.2" width="9" height="7.6" rx="1.4"/><path d="M10.8 7l3.4-2v6l-3.4-2"/>',
    'use:microphone': '<rect x="5.8" y="1.8" width="4.4" height="7.6" rx="2.2"/><path d="M3.4 7.6a4.6 4.6 0 0 0 9.2 0M8 12.2v2"/>',
    'use:screen': '<rect x="1.8" y="2.6" width="12.4" height="8.6" rx="1.3"/><path d="M5.6 14h4.8M8 11.2V14"/>',
    'use:background': '<rect x="4.6" y="1.8" width="9.6" height="8" rx="1.3"/><path d="M1.8 5.4v7.4c0 .7.5 1.2 1.2 1.2h8"/>',
    'use:login': '<circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.4 1.6"/>',
    'use:usb': '<path d="M8 13.4V2.2M6 4.2l2-2 2 2M8 10.2l-3-1.8V6.6M8 8.6l3-1.8V5"/><circle cx="8" cy="13.4" r="1"/>',
    'use:serial': '<path d="M1.8 5h12.4l-1.8 6.4H3.6z"/><path d="M5 7.6h.01M8 7.6h.01M11 7.6h.01M6.5 9.4h.01M9.5 9.4h.01"/>',
    'use:hid': '<rect x="4.4" y="1.8" width="7.2" height="12.4" rx="3.6"/><path d="M8 1.8v4.4"/>',
    'use:midi': '<circle cx="8" cy="8" r="6.2"/><path d="M4.8 8h.01M11.2 8h.01M5.8 5.4h.01M10.2 5.4h.01M8 4.4h.01"/>',
    window: '<rect x="1.8" y="2.6" width="12.4" height="10.8" rx="1.4"/><path d="M1.8 5.6h12.4M4 4.1h.01M5.8 4.1h.01"/>',
    shortcut: '<rect x="1.8" y="4" width="12.4" height="8.4" rx="1.6"/><path d="M4.5 6.8h.01M7 6.8h.01M9.5 6.8h.01M12 6.8h.01M5 9.6h6"/>',
  };
  ICONS.write = ICONS.folder;

  document.querySelector('main').onscroll = () => (tip.hidden = true);
  tags.ontoggle = () => (location.hash = tags.open ? 'tags-open' : 'tags-closed');
  deny.onclick = () => (location.hash = 'deny');
  allow.onclick = () => (location.hash = trustChanges.checked ? 'trust' : 'allow');
  onkeydown = event => event.key === 'Escape' && (location.hash = 'deny');
</script>
