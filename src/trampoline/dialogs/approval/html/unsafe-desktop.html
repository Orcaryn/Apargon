<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Apargon</title>
<style>
  :root {
    --surface: #ffffff;
    --well: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --rule: #e5e5ea;
    --button: #ebebef;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1e1e20;
      --well: #28282b;
      --ink: #f5f5f7;
      --muted: #98989d;
      --rule: #38383b;
      --button: #3a3a3d;
    }
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    max-height: 100vh;
    background: var(--surface);
    color: var(--ink);
    font: 13px/18px system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-app-region: drag;
    user-select: none;
  }
  main {
    min-height: 0;
    overflow-y: auto;
    padding: 20px 22px 16px;
  }
  h1 {
    font-size: 17px;
    font-weight: 650;
    line-height: 22px;
    letter-spacing: -0.015em;
  }
  p {
    margin-top: 6px;
    color: var(--muted);
  }
  footer {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 12px 22px;
    border-top: 1px solid var(--rule);
    background: var(--well);
  }
  button {
    min-width: 92px;
    height: 30px;
    padding: 0 14px;
    border: 0;
    border-radius: 7px;
    background: var(--button);
    color: var(--ink);
    font: inherit;
    font-weight: 500;
    -webkit-app-region: no-drag;
  }
  #deny {
    margin-left: auto;
  }
  #allow {
    background: var(--ink);
    color: var(--surface);
  }
  button:active {
    filter: brightness(0.92);
  }
  button:focus-visible {
    outline: 3px solid -webkit-focus-ring-color;
    outline-offset: 1px;
  }
</style>

<main>
  <h1>On X11, Apargon can't keep your data in.</h1>
  <p>Log in with Wayland to be safe.</p>
</main>
<footer>
  <button id="deny">Cancel</button>
  <button id="allow">Open anyway</button>
</footer>

<script>
  // Nothing from the .papp file: the text is the same for every one.
  function render() {
    deny.focus();
  }

  deny.onclick = () => (location.hash = 'deny');
  allow.onclick = () => (location.hash = 'allow');
  onkeydown = event => event.key === 'Escape' && (location.hash = 'deny');
</script>
