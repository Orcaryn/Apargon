<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>papp</title>
<style>
  :root {
    --surface: #ffffff;
    --well: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --rule: #e5e5ea;
    --red: #d70015;
    --yellow: #e8a300;
    --button: #ebebef;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1e1e20;
      --well: #28282b;
      --ink: #f5f5f7;
      --muted: #98989d;
      --rule: #38383b;
      --red: #ff453a;
      --yellow: #ffb340;
      --button: #3a3a3d;
    }
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  [hidden] {
    display: none;
  }
  body {
    background: var(--surface);
    color: var(--ink);
    font: 13px/1.45 system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-app-region: drag;
    user-select: none;
  }
  main {
    padding: 20px 22px 14px;
  }
  h1 {
    font-size: 17px;
    font-weight: 650;
    line-height: 1.25;
    letter-spacing: -0.015em;
    overflow-wrap: anywhere;
  }
  .folder {
    margin-top: 3px;
    color: var(--muted);
    font-size: 11.5px;
    overflow-wrap: anywhere;
  }
  .worst {
    margin-top: 6px;
    color: var(--red);
    font-weight: 600;
  }
  ol {
    margin-top: 12px;
    padding: 0;
    list-style: none;
  }
  li {
    display: flex;
    gap: 10px;
    padding: 5px 0;
    overflow-wrap: anywhere;
  }
  li svg {
    flex: none;
    margin-top: 1px;
    fill: none;
    stroke: var(--muted);
    stroke-width: 1.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  li.red svg {
    stroke: var(--red);
  }
  li.yellow svg {
    stroke: var(--yellow);
  }
  .new {
    display: inline-block;
    margin-right: 6px;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--ink);
    color: var(--surface);
    font-size: 10.5px;
    font-weight: 600;
    line-height: 17px;
    vertical-align: 1px;
  }
  .note {
    margin-top: 8px;
    color: var(--muted);
    font-size: 11.5px;
  }
  details {
    margin-top: 10px;
    -webkit-app-region: no-drag;
  }
  summary {
    width: fit-content;
    color: var(--muted);
    font-size: 11.5px;
    cursor: default;
  }
  summary:focus-visible {
    outline: 3px solid -webkit-focus-ring-color;
    outline-offset: 1px;
    border-radius: 3px;
  }
  pre {
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--well);
    font: 11px/1.5 ui-monospace, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    user-select: text;
  }
  .trust {
    margin-top: 14px;
  }
  label {
    display: flex;
    gap: 9px;
    align-items: center;
    font-weight: 500;
    -webkit-app-region: no-drag;
  }
  .hint {
    margin: 2px 0 0 24px;
    color: var(--muted);
    font-size: 11.5px;
  }
  input {
    margin: 0;
    width: 15px;
    height: 15px;
    accent-color: var(--red);
  }
  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-top: 1px solid var(--rule);
    background: var(--well);
  }
  .source {
    flex: 1;
    color: var(--muted);
    font-size: 11.5px;
    overflow-wrap: anywhere;
  }
  .source.downloaded {
    color: var(--red);
    font-weight: 600;
  }
  button {
    min-width: 96px;
    height: 30px;
    padding: 0 14px;
    border: 0;
    border-radius: 7px;
    background: var(--button);
    color: var(--ink);
    font: inherit;
    font-weight: 500;
    -webkit-app-region: no-drag;
  }
  #allow {
    background: var(--ink);
    color: var(--surface);
  }
  button:active {
    filter: brightness(0.92);
  }
  button:disabled {
    opacity: 0.35;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 3px solid -webkit-focus-ring-color;
    outline-offset: 1px;
  }
</style>

<main>
  <h1 id="pageName"></h1>
  <p class="folder" id="folder"></p>
  <p class="worst" id="changed" hidden></p>
  <p class="worst" id="worst" hidden></p>
  <ol id="lines" aria-label="If you allow it, this page can:"></ol>
  <p class="note" id="note" hidden></p>
  <details id="tags">
    <summary>The tags as written</summary>
    <pre id="tagList"></pre>
  </details>
  <div class="trust" id="trust" hidden>
    <label><input type="checkbox" id="trusted" /> I trust this page.</label>
    <p class="hint">Not sure? Ask an AI to check the file before you allow it.</p>
  </div>
</main>
<footer>
  <p class="source" id="source"></p>
  <button id="deny">Don't open</button>
  <button id="allow">Allow and open</button>
</footer>

<script>
  // Every string in popup comes from the page: set it as text, never HTML. Only ICONS go in as HTML.
  function render(popup) {
    source.textContent = popup.source;
    source.classList.toggle('downloaded', popup.downloaded);
    pageName.textContent = popup.name;
    changed.textContent = popup.changed;
    changed.hidden = popup.changed === null;
    worst.textContent = popup.worst;
    worst.hidden = popup.worst === null;
    note.textContent = popup.note;
    note.hidden = popup.note === null;
    folder.textContent = popup.folder;
    tagList.textContent = popup.tags.join('\n');
    trust.hidden = !popup.trust;
    allow.disabled = popup.trust;

    for (const line of popup.lines) {
      const item = document.createElement('li');
      item.className = line.level;
      item.innerHTML = `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">${ICONS[line.kind]}</svg><span></span>`;
      const text = item.lastChild;

      if (line.isNew) {
        text.append(Object.assign(document.createElement('span'), { className: 'new', textContent: 'New' }));
      }

      text.append(line.text);
      lines.append(item);
    }

    deny.focus();
  }

  const ICONS = {
    node: '<rect x="3" y="7" width="10" height="7" rx="1.2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.7"/>',
    run: '<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.5"/><path d="M4.5 6.3l2 1.7-2 1.7M8 10h3"/>',
    socket: '<path d="M6 1.8v3M10 1.8v3M4 4.8h8v3a4 4 0 0 1-8 0zM8 11.8v2.4"/>',
    env: '<circle cx="5" cy="8" r="2.8"/><path d="M7.8 8h6.4M12 8v2.2M14.2 8v1.6"/>',
    write: '<path d="M10.8 2.4l2.8 2.8-7.9 7.9-3.4.6.6-3.4z"/>',
    read: '<path d="M1.5 4.2c0-.7.5-1.2 1.2-1.2h3.4l1.4 1.5h5.8c.7 0 1.2.5 1.2 1.2v6.4c0 .7-.5 1.2-1.2 1.2H2.7c-.7 0-1.2-.5-1.2-1.2z"/>',
    net: '<circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.8 1.9 2.6 4 2.6 6.2S9.8 12.3 8 14.2C6.2 12.3 5.4 10.2 5.4 8S6.2 3.7 8 1.8"/>',
    use: '<path d="M8 2.2a4 4 0 0 1 4 4v3.2l1.3 2H2.7l1.3-2V6.2a4 4 0 0 1 4-4zM6.4 13.4a1.6 1.6 0 0 0 3.2 0"/>',
    shortcut: '<rect x="1.8" y="4" width="12.4" height="8.4" rx="1.6"/><path d="M4.5 6.8h.01M7 6.8h.01M9.5 6.8h.01M12 6.8h.01M5 9.6h6"/>',
  };
  ICONS.own = ICONS.read;

  trusted.onchange = () => (allow.disabled = !trusted.checked);
  tags.ontoggle = () => (location.hash = tags.open ? 'tags-open' : 'tags-closed');
  deny.onclick = () => (location.hash = 'deny');
  allow.onclick = () => (location.hash = 'allow');
  onkeydown = event => event.key === 'Escape' && (location.hash = 'deny');
</script>
