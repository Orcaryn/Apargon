<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>resworb</title>
<style>
  :root {
    --surface: #ffffff;
    --well: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --rule: #e5e5ea;
    --plain: #c7c7cc;
    --red: #d70015;
    --yellow: #e8a300;
    --button: #ebebef;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1e1e20;
      --well: #28282b;
      --ink: #f5f5f7;
      --muted: #98989d;
      --rule: #38383b;
      --plain: #545458;
      --red: #ff453a;
      --yellow: #ffb340;
      --button: #3a3a3d;
    }
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  [hidden] {
    display: none;
  }
  body {
    background: var(--surface);
    color: var(--ink);
    font: 13px/1.45 system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-app-region: drag;
    user-select: none;
  }
  main {
    padding: 24px 24px 20px;
  }
  .origin {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--well);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 500;
  }
  h1 {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 650;
    line-height: 1.25;
    letter-spacing: -0.015em;
    overflow-wrap: anywhere;
  }
  .folder {
    margin-top: 3px;
    color: var(--muted);
    font-size: 11.5px;
    overflow-wrap: anywhere;
  }
  .worst {
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--red) 9%, var(--surface));
    color: var(--red);
    font-weight: 600;
    line-height: 1.4;
  }
  h2 {
    margin-top: 20px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 500;
  }
  ol {
    margin-top: 6px;
    padding: 0;
    list-style: none;
    border: 1px solid var(--rule);
    border-radius: 10px;
  }
  li {
    position: relative;
    padding: 10px 14px 10px 27px;
    overflow-wrap: anywhere;
  }
  li + li {
    border-top: 1px solid var(--rule);
  }
  li::before {
    content: '';
    position: absolute;
    left: 13px;
    top: 12px;
    bottom: 12px;
    width: 3px;
    border-radius: 2px;
    background: var(--plain);
  }
  li.red::before {
    background: var(--red);
  }
  li.yellow::before {
    background: repeating-linear-gradient(var(--yellow) 0 4px, transparent 4px 7px);
  }
  .new {
    display: inline-block;
    margin-right: 6px;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--ink);
    color: var(--surface);
    font-size: 10.5px;
    font-weight: 600;
    line-height: 17px;
    vertical-align: 1px;
  }
  .note {
    margin-top: 8px;
    color: var(--muted);
    font-size: 11.5px;
  }
  label {
    display: flex;
    gap: 9px;
    align-items: center;
    margin-top: 16px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    font-weight: 600;
    -webkit-app-region: no-drag;
  }
  input {
    margin: 0;
    width: 15px;
    height: 15px;
    accent-color: var(--red);
  }
  footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 14px 24px;
    border-top: 1px solid var(--rule);
    background: var(--well);
  }
  button {
    min-width: 96px;
    height: 30px;
    padding: 0 14px;
    border: 0;
    border-radius: 7px;
    background: var(--button);
    color: var(--ink);
    font: inherit;
    font-weight: 500;
    -webkit-app-region: no-drag;
  }
  #allow {
    background: var(--ink);
    color: var(--surface);
  }
  button:active {
    filter: brightness(0.92);
  }
  button:disabled {
    opacity: 0.35;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 3px solid -webkit-focus-ring-color; /* the system's ring, in the user's accent colour */
    outline-offset: 1px;
  }
</style>

<main>
  <p class="origin" id="source"></p>
  <h1 id="pageName"></h1>
  <p class="folder" id="folder"></p>
  <p class="worst" id="worst" hidden></p>
  <h2>If you allow it, this page can:</h2>
  <ol id="lines"></ol>
  <p class="note" id="note" hidden></p>
  <label id="trust" hidden><input type="checkbox" id="trusted" /> I trust where this page came from.</label>
</main>
<footer>
  <button id="deny">Don't open</button>
  <button id="allow">Allow and open</button>
</footer>

<script>
  // approve.ts calls render once, then reads the answer from the hash. Every string is text, never HTML.
  function render(popup) {
    source.textContent = popup.source;
    pageName.textContent = popup.name;
    worst.textContent = popup.worst;
    worst.hidden = popup.worst === null;
    note.textContent = popup.note;
    note.hidden = popup.note === null;
    folder.textContent = popup.folder;
    trust.hidden = !popup.trust;
    allow.disabled = popup.trust;

    for (const line of popup.lines) {
      const item = document.createElement('li');
      item.className = line.level;

      if (line.isNew) {
        item.append(Object.assign(document.createElement('span'), { className: 'new', textContent: 'New' }));
      }

      item.append(line.text);
      lines.append(item);
    }

    deny.focus();

    return document.body.offsetHeight;
  }

  trusted.onchange = () => (allow.disabled = !trusted.checked);
  deny.onclick = () => (location.hash = 'deny');
  allow.onclick = () => (location.hash = 'allow');
  onkeydown = event => event.key === 'Escape' && (location.hash = 'deny');
</script>
