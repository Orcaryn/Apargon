<!doctype html>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Apargon</title>
<style>
  :root {
    --surface: #ffffff;
    --well: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --rule: #e5e5ea;
    --red: #d70015;
    --yellow: #e8a300;
    --button: #ebebef;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1e1e20;
      --well: #28282b;
      --ink: #f5f5f7;
      --muted: #98989d;
      --rule: #38383b;
      --red: #ff453a;
      --yellow: #ffb340;
      --button: #3a3a3d;
    }
  }
  * {
    box-sizing: border-box;
    margin: 0;
  }
  [hidden] {
    display: none !important;
  }
  body {
    display: flex;
    flex-direction: column;
    max-height: 100vh;
    background: var(--surface);
    color: var(--ink);
    font: 13px/18px system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-app-region: drag;
    user-select: none;
  }
  header {
    flex: none;
    padding: 20px 22px 14px;
  }
  h1 {
    font-size: 17px;
    font-weight: 650;
    line-height: 22px;
    letter-spacing: -0.015em;
    overflow-wrap: anywhere;
  }
  .where {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 16px;
    overflow-wrap: anywhere;
  }
  .where .downloaded {
    color: var(--red);
    font-weight: 500;
  }
  .callout {
    display: flex;
    gap: 9px;
    margin-top: 12px;
    padding: 9px 12px;
    border-radius: 9px;
    background: color-mix(in srgb, var(--red) 8%, transparent);
    font-weight: 500;
  }
  .callout svg {
    flex: none;
    margin-top: 1px;
    fill: none;
    stroke: var(--red);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  main {
    min-height: 0;
    overflow-y: auto;
    padding: 2px 22px 16px;
    -webkit-app-region: no-drag;
  }
  section + section {
    margin-top: 14px;
  }
  h2 {
    margin: 0 0 6px 2px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
  }
  ol {
    padding: 0;
    list-style: none;
    border-radius: 10px;
    background: var(--well);
  }
  li {
    display: flex;
    gap: 10px;
    padding: 8px 12px;
    overflow-wrap: anywhere;
  }
  li + li {
    border-top: 1px solid var(--rule);
  }
  li svg {
    flex: none;
    margin-top: 1px;
    fill: none;
    stroke: var(--muted);
    stroke-width: 1.3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  li.red svg {
    stroke: var(--red);
  }
  li.yellow svg {
    stroke: var(--yellow);
  }
  .new {
    display: inline-block;
    margin-right: 6px;
    padding: 0 5px;
    border: 1px solid var(--muted);
    border-radius: 4px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 600;
    line-height: 14px;
    vertical-align: 1px;
  }
  .term {
    position: relative;
    text-decoration: underline dotted var(--muted);
    text-underline-offset: 3px;
    cursor: help;
  }
  .term::after {
    content: attr(data-tip);
    position: absolute;
    top: calc(100% + 6px);
    left: -6px;
    z-index: 1;
    width: max-content;
    max-width: 280px;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--ink);
    color: var(--surface);
    font-size: 11px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s 0.25s;
  }
  .term:hover::after,
  .term:focus-visible::after {
    opacity: 1;
  }
  .note {
    margin: 12px 2px 0;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 16px;
  }
  details {
    margin-top: 10px;
  }
  summary {
    width: fit-content;
    margin-left: 2px;
    color: var(--muted);
    font-size: 11.5px;
    cursor: default;
  }
  summary:focus-visible {
    outline: 3px solid -webkit-focus-ring-color;
    outline-offset: 1px;
    border-radius: 3px;
  }
  pre {
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--well);
    font: 11px/1.5 ui-monospace, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    user-select: text;
  }
  footer {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-top: 1px solid var(--rule);
    background: var(--well);
  }
  label {
    display: flex;
    gap: 8px;
    align-items: center;
    font-weight: 500;
    -webkit-app-region: no-drag;
  }
  .hint {
    margin: 1px 0 0 23px;
    color: var(--muted);
    font-size: 11px;
    line-height: 15px;
  }
  input {
    margin: 0;
    width: 15px;
    height: 15px;
  }
  button {
    min-width: 92px;
    height: 30px;
    padding: 0 14px;
    border: 0;
    border-radius: 7px;
    background: var(--button);
    color: var(--ink);
    font: inherit;
    font-weight: 500;
    -webkit-app-region: no-drag;
  }
  #deny {
    margin-left: auto;
  }
  #allow {
    background: var(--ink);
    color: var(--surface);
  }
  button:active {
    filter: brightness(0.92);
  }
  button:disabled {
    opacity: 0.35;
  }
  button:focus-visible,
  input:focus-visible,
  .term:focus-visible {
    outline: 3px solid -webkit-focus-ring-color;
    outline-offset: 1px;
  }
</style>

<header>
  <h1 id="pageName"></h1>
  <p class="where"><span id="folder"></span> · <span id="source"></span></p>
  <p class="callout" id="changed" hidden>
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <path d="M8 2.2l6.2 11H1.8z" />
      <path d="M8 6.6v3M8 11.4h.01" /></svg
    ><span id="changedText"></span>
  </p>
  <p class="callout" id="worst" hidden>
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <path d="M8 2.2l6.2 11H1.8z" />
      <path d="M8 6.6v3M8 11.4h.01" /></svg
    ><span id="worstText"></span>
  </p>
</header>
<main>
  <div id="groups" aria-label="If you allow it, this page can:"></div>
  <p class="note" id="note" hidden></p>
  <details id="tags">
    <summary>The tags as written</summary>
    <pre id="tagList"></pre>
  </details>
</main>
<footer>
  <div class="trust" id="trust" hidden>
    <label><input type="checkbox" id="trusted" /> I trust this page.</label>
    <p class="hint">Not sure? Ask an AI to check it.</p>
  </div>
  <button id="deny">Don't open</button>
  <button id="allow">Allow and open</button>
</footer>

<script>
  // Every string in popup comes from the page: set it as text, never HTML.
  function render(popup) {
    source.textContent = popup.source;
    source.classList.toggle('downloaded', popup.downloaded);
    pageName.textContent = popup.name;
    folder.textContent = popup.folder;
    changedText.textContent = popup.changed;
    changed.hidden = popup.changed === null;
    worstText.textContent = popup.worst;
    worst.hidden = popup.worst === null;
    note.textContent = popup.note;
    note.hidden = popup.note === null;
    tagList.textContent = popup.tags.join('\n');
    trust.hidden = !popup.trust;
    allow.disabled = popup.trust;

    // Lines come sorted worst first, so each group lands where its worst line would.
    const listOfGroup = new Map();

    for (const line of popup.lines) {
      const kind = line.id.split(':')[0];
      const group = GROUP_OF_KIND[kind];

      if (!listOfGroup.has(group)) {
        const section = groups.appendChild(document.createElement('section'));
        section.append(Object.assign(document.createElement('h2'), { textContent: group }));
        listOfGroup.set(group, section.appendChild(document.createElement('ol')));
      }

      const item = document.createElement('li');
      item.className = line.level;
      item.innerHTML = `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">${ICONS[line.id] ?? ICONS[kind]}</svg><span></span>`;
      const text = item.lastChild;

      if (line.isNew) {
        text.append(Object.assign(document.createElement('span'), { className: 'new', textContent: 'New' }));
      }

      const term = Object.assign(document.createElement('span'), { className: 'term', tabIndex: 0, textContent: line.short });
      term.dataset.tip = line.text;
      term.setAttribute('aria-label', `${line.short}, ${line.text}`);
      text.append(term);
      listOfGroup.get(group).append(item);
    }

    deny.focus();
  }

  const GROUP_OF_KIND = { node: 'Programs', run: 'Programs', socket: 'Programs', env: 'Programs', write: 'Files', read: 'Files', own: 'Files', net: 'Network', open: 'Network', use: 'This computer', shortcut: 'This computer' };
  const ICONS = {
    node: '<rect x="3" y="7" width="10" height="7" rx="1.2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.7"/>',
    run: '<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.5"/><path d="M4.5 6.3l2 1.7-2 1.7M8 10h3"/>',
    socket: '<path d="M6 1.8v3M10 1.8v3M4 4.8h8v3a4 4 0 0 1-8 0zM8 11.8v2.4"/>',
    env: '<circle cx="5" cy="8" r="2.8"/><path d="M7.8 8h6.4M12 8v2.2M14.2 8v1.6"/>',
    write: '<path d="M10.8 2.4l2.8 2.8-7.9 7.9-3.4.6.6-3.4z"/>',
    read: '<path d="M1.5 4.2c0-.7.5-1.2 1.2-1.2h3.4l1.4 1.5h5.8c.7 0 1.2.5 1.2 1.2v6.4c0 .7-.5 1.2-1.2 1.2H2.7c-.7 0-1.2-.5-1.2-1.2z"/>',
    net: '<circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.8 1.9 2.6 4 2.6 6.2S9.8 12.3 8 14.2C6.2 12.3 5.4 10.2 5.4 8S6.2 3.7 8 1.8"/>',
    open: '<path d="M9.5 2h4.5v4.5M14 2L7.5 8.5M12 9.5v3.3c0 .7-.5 1.2-1.2 1.2H3.2c-.7 0-1.2-.5-1.2-1.2V5.2C2 4.5 2.5 4 3.2 4h3.3"/>',
    'use:notifications': '<path d="M8 2.2a4 4 0 0 1 4 4v3.2l1.3 2H2.7l1.3-2V6.2a4 4 0 0 1 4-4zM6.4 13.4a1.6 1.6 0 0 0 3.2 0"/>',
    'use:clipboard': '<rect x="3" y="2.8" width="10" height="11.4" rx="1.4"/><path d="M6 2.8V2h4v.8M5.5 7h5M5.5 9.8h5"/>',
    'use:location': '<path d="M8 14.2s4.6-4.1 4.6-7.6a4.6 4.6 0 0 0-9.2 0c0 3.5 4.6 7.6 4.6 7.6z"/><circle cx="8" cy="6.6" r="1.6"/>',
    'use:sound': '<path d="M2.2 6h2.6L8.4 3v10L4.8 10H2.2zM10.8 5.6a3.4 3.4 0 0 1 0 4.8M12.6 3.8a6 6 0 0 1 0 8.4"/>',
    'use:camera': '<rect x="1.8" y="4.2" width="9" height="7.6" rx="1.4"/><path d="M10.8 7l3.4-2v6l-3.4-2"/>',
    'use:microphone': '<rect x="5.8" y="1.8" width="4.4" height="7.6" rx="2.2"/><path d="M3.4 7.6a4.6 4.6 0 0 0 9.2 0M8 12.2v2"/>',
    'use:screen': '<rect x="1.8" y="2.6" width="12.4" height="8.6" rx="1.3"/><path d="M5.6 14h4.8M8 11.2V14"/>',
    shortcut: '<rect x="1.8" y="4" width="12.4" height="8.4" rx="1.6"/><path d="M4.5 6.8h.01M7 6.8h.01M9.5 6.8h.01M12 6.8h.01M5 9.6h6"/>',
  };
  ICONS.own = ICONS.read;

  trusted.onchange = () => (allow.disabled = !trusted.checked);
  tags.ontoggle = () => (location.hash = tags.open ? 'tags-open' : 'tags-closed');
  deny.onclick = () => (location.hash = 'deny');
  allow.onclick = () => (location.hash = 'allow');
  onkeydown = event => event.key === 'Escape' && (location.hash = 'deny');
</script>
